# ── Modifier rules ─────────────────────────────────────────────────────────────
# Applied AFTER base tags are set.
# "shift" adjusts a dimension by N steps (+ = heavier/more effort, - = lighter)
modifiers:
  heaviness:
    lighter:
      shift: -1
      triggers:
        - mit salat
        - with salad
        - mit gemüse
        - with vegetables
        - leicht
        - light version
        - kleine portion
        - small portion
    heavier:
      shift: +1
      triggers:
        - extra käse
        - extra cheese
        - mit pommes
        - with fries
        - doppelt
        - double
        - große portion
        - large portion
  effort:
    reduce:
      shift: -1
      triggers:
        - reste
        - leftovers
        - aufgewärmt
        - reheated
        - aus der dose
        - from a can
    increase:
      shift: +1
      triggers:
        - selbstgemacht
        - homemade
        - von grund auf
        - from scratch

# ── Inheritance rules ──────────────────────────────────────────────────────────
# When description references a previous meal ("Reste vom Curry"),
# inherit the referenced meal's tags and override effort to minimal.
inheritance_triggers:
  - reste vom
  - rest vom
  - leftovers from
  - übrig von
  - aufgewärmte
  - reheated

# ── Ordered food detection ─────────────────────────────────────────────────────
# If any of these appear, home_cooked = false, effort = none
ordered_triggers:
  - lieferando
  - uber eats
  - deliveroo
  - wolt
  - pizza service
  - bestellt bei
  - ordered from
  - takeaway
  - takeout

# ── Specific known dishes ─────────────────────────────────────────────────────
# Highest priority — overrides all keyword matching.
