meta:
  version: 1
  created: "2026-03-28"
  auto_entries: 0
  manual_entries: 0          # bumped at runtime
  pending_review: 0

# ── Valid values for each dimension ───────────────────────────────────────────
taxonomy:
  cuisine:
    - german
    - italian
    - asian
    - japanese
    - indian
    - mexican
    - french
    - mediterranean
    - american
    - middle_eastern
    - neutral
  effort:
    - none        # ordered / not cooked at all
    - minimal     # leftovers, bread, cold assembly
    - low         # eggs, sandwiches, quick pan
    - medium      # one-pot, stir-fry, simple oven
    - high        # roasts, complex bakes, multi-step
  heaviness:
    - very_light  # smoothie, yogurt, fruit
    - light       # salad, soup, broth
    - medium      # rice + protein, stir-fry, pasta
    - heavy       # schnitzel, pizza, curry with rice
    - very_heavy  # Christmas dinner, full roast, fondue
  meal_type:
    - breakfast
    - brunch
    - lunch
    - dinner
    - snack
    - dessert
    - drink
  dietary:
    - vegetarian
    - vegan
    - gluten_free
    - dairy_free
    - nut_free
    - low_carb
    - high_protein

