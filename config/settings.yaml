# ─── Agent Settings ───────────────────────────────────────────────────────────
agent:
  # Conversation history kept in Redis per session
  history_window: 20
  # Max seconds before a request is routed to a faster/simpler fallback
  timeout_tool: 8
  timeout_general: 25
  timeout_research: 45

# ─── Models ───────────────────────────────────────────────────────────────────
models:
  # Fast tool-calling model (nemotron-mini or similar 4B)
  tool:
    name: "nemotron-mini"          # ollama model name – override to match pulled model
    temperature: 0.0
    num_ctx: 4096
    num_predict: 512

  # General conversation model (Qwen 2.5 9B or similar)
  general:
    name: "qwen2.5:7b"            # adjust to actual pulled model name
    temperature: 0.3
    num_ctx: 8192
    num_predict: 1024

  # Tiny background tagger model – loaded on demand, unloaded after use
  tagger:
    name: "qwen2.5:1.5b"
    temperature: 0.0
    num_ctx: 1024
    num_predict: 128
    keep_alive: "5m"              # unload 5 min after last use

  # Embeddings (local, runs on CPU – fastembed)
  embedding:
    name: "BAAI/bge-small-en-v1.5"
    batch_size: 64

  # Online fallback – used for deep reasoning / research synthesis
  online:
    provider: "anthropic"         # anthropic | openai
    anthropic_model: "claude-3-5-haiku-20241022"   # fast + cheap for research
    openai_model: "gpt-4o-mini"
    temperature: 0.3
    max_tokens: 2048

# ─── Routing Thresholds ───────────────────────────────────────────────────────
routing:
  # Confidence score (0-1) above which pattern matching triggers INSTANT path
  instant_confidence: 0.85
  # If tool agent can't resolve within N tokens, escalate to general
  tool_max_tokens_before_escalate: 400
  # Search results count for research agent
  search_result_count: 8
  # Trigger online LLM if local confidence below this
  escalate_to_online_threshold: 0.4

# ─── Home Assistant ───────────────────────────────────────────────────────────
home_assistant:
  # Entity domains to cache in Redis (refreshed via WS subscription)
  cached_domains:
    - light
    - switch
    - sensor
    - binary_sensor
    - climate
    - cover
    - lock
    - media_player
    - person
    - weather
  # State cache TTL in seconds (WS events keep it fresh, this is a safety net)
  state_ttl: 300
  # HA areas to include in RAG context (empty = all)
  areas: []

# ─── RAG ──────────────────────────────────────────────────────────────────────
rag:
  # Qdrant collection names
  collections:
    ha_docs: "ha_documentation"
    home_context: "home_context"       # rooms, devices, routines
    conversation: "conversation_memory"
  # Number of chunks to retrieve
  top_k: 5
  # Min similarity score (cosine)
  min_score: 0.6

# ─── n8n Workflows ────────────────────────────────────────────────────────────
n8n:
  # Map of workflow intent → n8n webhook path
  # These are triggered WITHOUT involving any LLM
  workflow_webhooks:
    morning_routine: "/webhook/morning-routine"
    evening_routine: "/webhook/evening-routine"
    night_mode: "/webhook/night-mode"
    away_mode: "/webhook/away-mode"
    home_mode: "/webhook/home-mode"
    movie_mode: "/webhook/movie-mode"
    guest_mode: "/webhook/guest-mode"
    notify_all: "/webhook/notify-all"
    security_check: "/webhook/security-check"

# ─── Temporal ─────────────────────────────────────────────────────────────────
temporal:
  namespace: "ha-agent"
  task_queue: "ha-agent-tasks"
  # Workflow types that run as durable Temporal workflows
  durable_workflows:
    - "multi_step_automation"
    - "scheduled_routine"
    - "device_monitor"
    - "energy_optimization"
    - "catalog_consolidation"

# ─── Tagger ────────────────────────────────────────────────────────────────────
tagger:
  # Confidence below which the 1.5B LLM is invoked
  llm_fallback_threshold: 0.55
  # Confidence above which LLM proposals are auto-accepted into the catalog
  auto_accept_threshold: 0.92
  # Run consolidation every N days (via Temporal scheduled workflow)
  consolidation_interval_days: 7

# ─── Email (IMAP) ─────────────────────────────────────────────────────────────
email:
  # IMAP server settings – supports any IMAP provider (Gmail, Mailcow, Dovecot…)
  host: ""                    # e.g. mail.example.com or imap.gmail.com
  port: 993
  ssl: true
  username: ""                # your email address
  password: ""                # or app-specific password for Gmail
  folder: "INBOX"
  # Max age of emails to surface in summaries
  default_days_back: 7

# ─── Financial Planning (Firefly III) ─────────────────────────────────────────
finance:
  # Firefly III self-hosted instance
  url: "http://firefly:8080"  # adjust if running externally
  token: ""                   # Personal Access Token from Firefly III profile

# ─── Paperless-ngx ────────────────────────────────────────────────────────────
paperless:
  url: "http://paperless:8000"
  token: ""                   # API token from paperless admin → your profile
  # Tags used to identify receipts (add your own)
  receipt_tags:
    - "receipt"
    - "kassenbon"
    - "quittung"
    - "einkauf"
