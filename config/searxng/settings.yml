use_default_settings: true

general:
  debug: false
  instance_name: "HA Agent Search"
  privacypolicy_url: false
  contact_url: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""
  formats:
    - html
    - json

server:
  secret_key: "changeme-secret-key"
  bind_address: "0.0.0.0"
  port: 8080
  base_url: false
  image_proxy: false

ui:
  static_use_hash: true
  default_theme: simple
  query_in_title: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20

engines:
  - name: google
    engine: google
    shortcut: g
    use_mobile_ui: false

  - name: bing
    engine: bing
    shortcut: bi

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    base_url: "https://{language}.wikipedia.org/"
    number_of_results: 5
