version: "3.9"

services:
  # ─── Local LLM Inference ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ha-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1          # keep models hot in memory
      - OLLAMA_MAX_LOADED_MODELS=2    # tool agent + general agent simultaneously
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        limits:
          memory: 22G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Vector Database (RAG) ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ha-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Cache + Pub/Sub ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 3gb --maxmemory-policy allkeys-lru --save 60 1 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Search Engine ─────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: ha-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Non-AI Workflow Automation (n8n) ──────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: ha-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme32charsminimumrequired00}
      - DB_TYPE=sqlite
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Temporal Server (Durable Workflow Orchestration) ─────────────────────
  temporal:
    image: temporalio/auto-setup:latest
    container_name: ha-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamicconfig/development-sql.yaml
    volumes:
      - temporal_data:/etc/temporal/data
      - ./config/temporal:/etc/temporal/dynamicconfig
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "tctl", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    container_name: ha-temporal-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    depends_on:
      - temporal

  # ─── Main Agent API (LangGraph orchestrator) ──────────────────────────────
  ha-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ha-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - agent_data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
      - N8N_URL=http://n8n:5678
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=ha-agent
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Temporal Worker (runs inside same image) ─────────────────────────────
  ha-temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ha-temporal-worker
    restart: unless-stopped
    command: ["python", "-m", "core.workflows.temporal_worker"]
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - N8N_URL=http://n8n:5678
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=ha-agent
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ollama_data:
  qdrant_data:
  redis_data:
  n8n_data:
  temporal_data:
  agent_data:
