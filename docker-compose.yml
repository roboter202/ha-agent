version: "3.9"

services:
  # ─── Local LLM Inference ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ha-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1          # keep models hot in memory
      - OLLAMA_MAX_LOADED_MODELS=2    # tool agent + general agent simultaneously
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        limits:
          memory: 22G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Vector Database (RAG) ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ha-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Cache + Pub/Sub ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 3gb --maxmemory-policy allkeys-lru --save 60 1 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Search Engine ─────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: ha-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Non-AI Workflow Automation (n8n) ──────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: ha-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme32charsminimumrequired00}
      - DB_TYPE=sqlite
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Temporal Server (Durable Workflow Orchestration) ─────────────────────
  temporal:
    image: temporalio/auto-setup:latest
    container_name: ha-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamicconfig/development-sql.yaml
    volumes:
      - temporal_data:/etc/temporal/data
      - ./config/temporal:/etc/temporal/dynamicconfig
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "tctl", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    container_name: ha-temporal-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    depends_on:
      - temporal

  # ─── Main Agent API (LangGraph orchestrator) ──────────────────────────────
  ha-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ha-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - agent_data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
      - N8N_URL=http://n8n:5678
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=ha-agent
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Document Management (Paperless-ngx) ─────────────────────────────────
  paperless-redis:
    image: redis:7-alpine
    container_name: ha-paperless-redis
    restart: unless-stopped

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: ha-paperless
    restart: unless-stopped
    depends_on:
      - paperless-redis
    ports:
      - "8010:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - ./config/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_OCR_LANGUAGES: deu+eng         # German + English OCR
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-changeme-paperless-secret}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-changeme}
      PAPERLESS_URL: http://localhost:8010
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Financial Planning (Firefly III) ─────────────────────────────────────
  firefly-db:
    image: mariadb:10.11
    container_name: ha-firefly-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${FIREFLY_DB_ROOT_PASSWORD:-firefly_root}
      MYSQL_DATABASE: firefly
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${FIREFLY_DB_PASSWORD:-firefly_pass}
    volumes:
      - firefly_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 10s
      retries: 5

  firefly:
    image: fireflyiii/core:latest
    container_name: ha-firefly
    restart: unless-stopped
    depends_on:
      firefly-db:
        condition: service_healthy
    ports:
      - "8011:8080"
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    environment:
      APP_ENV: production
      APP_KEY: ${FIREFLY_APP_KEY:-SomeRandomStringOf32CharsExactly}
      DB_CONNECTION: mysql
      DB_HOST: firefly-db
      DB_PORT: 3306
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:-firefly_pass}
      TRUSTED_PROXIES: "**"
      APP_URL: http://localhost:8011
      DEFAULT_LANGUAGE: de_DE
      DEFAULT_LOCALE: de_DE
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/about"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Temporal Worker (runs inside same image) ─────────────────────────────
  ha-temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ha-temporal-worker
    restart: unless-stopped
    command: ["python", "-m", "core.workflows.temporal_worker"]
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - N8N_URL=http://n8n:5678
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=ha-agent
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ollama_data:
  qdrant_data:
  redis_data:
  n8n_data:
  temporal_data:
  agent_data:
  paperless_data:
  paperless_media:
  paperless_export:
  firefly_db_data:
  firefly_upload:
